<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DECK_TITLE}}</title>
<style>
/* slide-harness 標準テンプレート（IBM Carbon Design System のトークンに基づく）
   キーカラー Blue 60 #0F62FE / 淡色 Blue 10 #EDF5FF / 本文 Gray 100 #161616 / 罫線 Gray 50 #8D8D8D */
:root{
  --key:#0F62FE; --key-dark:#0043CE; --tint:#EDF5FF; --tint2:#D0E2FF;
  --ink:#161616; --ink-sub:#525252; --line:#8D8D8D; --paper:#FFFFFF;
  --warn:#B3261E; --focus:#FFD43D;
  --font:"IBM Plex Sans JP","IBM Plex Sans","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#3A3A3A;line-height:1.7}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{
  width:1280px;height:720px;flex:none;background:var(--paper);position:relative;
  padding:56px 72px 64px;display:none;flex-direction:column;transform-origin:center center;
}
.slide.active{display:flex}
.slide .kicker{font-size:15px;font-weight:700;color:var(--key);letter-spacing:.08em;margin-bottom:10px}
.slide h1{font-size:40px;line-height:1.35;font-weight:700;color:var(--ink);margin-bottom:28px}
.slide .fig{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.slide .fig svg{max-width:100%;max-height:100%}
.slide .takeaway{
  margin-top:28px;background:var(--tint);border-left:6px solid var(--key);
  padding:16px 20px;font-size:20px;font-weight:700;line-height:1.6;border-radius:0;background:#F4F4F4;
}
.slide .note{margin-top:14px;font-size:16px;color:var(--ink-sub);line-height:1.7}
.slide .pageno{position:absolute;right:72px;bottom:28px;font-size:14px;color:var(--ink-sub)}
.slide .deckname{position:absolute;left:72px;bottom:28px;font-size:14px;color:var(--ink-sub)}
/* 図の共通部品 */
svg text{font-family:var(--font)}
.box{fill:#fff;stroke:var(--key);stroke-width:2}
.box-tint{fill:var(--tint);stroke:var(--key);stroke-width:2}
.box-gray{fill:#F5F5F5;stroke:var(--line);stroke-width:1.5}
.box-warn{fill:#FDECEA;stroke:var(--warn);stroke-width:2}
.lbl{font-size:20px;font-weight:700;fill:var(--ink)}
.lbl-w{font-size:20px;font-weight:700;fill:#fff}
.sub{font-size:15px;fill:var(--ink-sub)}
.sub-w{font-size:15px;fill:#E8F1FE}
.arrow{stroke:var(--ink);stroke-width:2.5;fill:none;marker-end:url(#ah)}
.arrow-key{stroke:var(--key);stroke-width:3;fill:none;marker-end:url(#ahk)}
/* 操作 UI */
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:10px;align-items:center;z-index:10}
.hud button{
  font-family:var(--font);font-size:15px;font-weight:700;color:var(--key);background:#fff;
  border:2px solid var(--key);border-radius:8px;padding:8px 18px;cursor:pointer;
}
.hud button:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.hud .count{color:#fff;font-size:15px;font-weight:700}
.progress{position:fixed;top:0;left:0;height:5px;background:var(--key);z-index:10;transition:width .2s}
@media print{
  body{background:#fff}
  .stage{height:auto;display:block}
  .slide{display:flex;transform:none!important;page-break-after:always;border:1px solid var(--line);margin:0 auto 16px}
  .hud,.progress{display:none}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="stage" id="stage">
  <!-- スライドは section.slide を繰り返す。図は .fig の中にインライン SVG で実際に描く -->
  <section class="slide">
    <div class="kicker">{{SECTION}}</div>
    <h1>{{TITLE}}</h1>
    <div class="fig">
      <svg viewBox="0 0 1100 360" role="img" aria-label="{{FIG_ALT}}">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
          <marker id="ahk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0F62FE"/></marker>
        </defs>
        <!-- ここに図を描く -->
      </svg>
    </div>
    <div class="takeaway">{{TAKEAWAY}}</div>
    <div class="deckname">{{DECK_TITLE}}</div>
    <div class="pageno"></div>
  </section>
</div>
<style>
.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;align-items:center;z-index:20;background:rgba(22,22,22,.85);padding:8px 12px;border-radius:10px}
.toolbar button{font-family:var(--font);font-size:14px;font-weight:700;color:var(--key);background:#fff;border:2px solid var(--key);border-radius:6px;padding:6px 14px;cursor:pointer}
.toolbar button.on{background:var(--key);color:#fff}
.toolbar .count{color:#fff;font-size:14px;font-weight:700;min-width:64px;text-align:center}
.editpanel{position:fixed;right:18px;bottom:76px;z-index:20;background:#fff;border:2px solid var(--key);border-radius:10px;padding:14px 16px;display:none;width:280px;font-size:14px;color:var(--ink)}
body.editing .editpanel{display:block}
.editpanel label{display:block;margin:8px 0 2px;font-weight:700}
.editpanel input[type=range]{width:100%}
.editpanel .row{display:flex;gap:8px;margin-top:12px}
.editpanel button{flex:1;font-family:var(--font);font-size:14px;font-weight:700;color:var(--key);background:#fff;border:2px solid var(--key);border-radius:6px;padding:6px;cursor:pointer}
body.editing .slide [contenteditable]{outline:2px dashed var(--key);outline-offset:2px}
body.editing .slide svg text{cursor:text}
.overview{position:fixed;inset:0;background:rgba(22,22,22,.94);z-index:30;display:none;overflow:auto;padding:28px}
.overview.open{display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start;justify-content:center}
.overview .thumb{width:384px;height:216px;overflow:hidden;position:relative;cursor:pointer;border:3px solid transparent;border-radius:6px;flex:none}
.overview .thumb:hover{border-color:var(--key)}
.overview .thumb .slide{display:flex;position:absolute;left:0;top:0;transform:scale(.3);transform-origin:top left}
.overview .thumb .no{position:absolute;right:8px;bottom:6px;color:#fff;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;font-size:13px;z-index:2}
@media print{.toolbar,.editpanel,.overview{display:none!important}}
</style>
<div class="toolbar">
  <button id="tb-prev" type="button">← 前へ</button>
  <span class="count" id="tb-count"></span>
  <button id="tb-next" type="button">次へ →</button>
  <button id="tb-fs" type="button">全画面</button>
  <button id="tb-ov" type="button">一覧</button>
  <button id="tb-edit" type="button">編集</button>
</div>
<div class="editpanel" id="editpanel">
  <div><strong>微調整（現在のスライド）</strong></div>
  <label>図の大きさ <span id="v-fig"></span></label>
  <input type="range" id="r-fig" min="60" max="130" value="100">
  <label>タイトルの文字 <span id="v-title"></span></label>
  <input type="range" id="r-title" min="28" max="48" value="38">
  <label>要点の文字 <span id="v-take"></span></label>
  <input type="range" id="r-take" min="15" max="26" value="20">
  <div class="row">
    <button id="ep-reset" type="button">このスライドをリセット</button>
    <button id="ep-save" type="button">HTMLで保存</button>
  </div>
  <div style="margin-top:10px;color:var(--ink-sub)">本文はクリックで直接編集できます。図の中の文字はダブルクリックで編集できます。</div>
</div>
<div class="overview" id="overview"></div>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var i=0, editing=false;
  function fit(){
    if(document.body.classList.contains('overview-open'))return;
    var s=Math.min(window.innerWidth/1320,window.innerHeight/760,1.4);
    slides.forEach(function(el){el.style.transform='scale('+s+')';});
  }
  function syncPanel(){
    var sl=slides[i]; if(!sl)return;
    var svg=sl.querySelector('.fig svg');
    var fig=100; if(svg&&svg.style.transform){var m=svg.style.transform.match(/scale\(([\d.]+)\)/); if(m)fig=Math.round(parseFloat(m[1])*100);}
    var h1=sl.querySelector('h1'); var tk=sl.querySelector('.takeaway');
    document.getElementById('r-fig').value=fig; document.getElementById('v-fig').textContent=fig+'%';
    var tv=h1?(parseInt(h1.style.fontSize)||38):38; document.getElementById('r-title').value=tv; document.getElementById('v-title').textContent=tv+'px';
    var kv=tk?(parseInt(tk.style.fontSize)||20):20; document.getElementById('r-take').value=kv; document.getElementById('v-take').textContent=kv+'px';
  }
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(el,k){el.classList.toggle('active',k===i);});
    document.getElementById('tb-count').textContent=(i+1)+' / '+slides.length;
    var pr=document.getElementById('progress'); if(pr)pr.style.width=((i+1)/slides.length*100)+'%';
    fit(); syncPanel();
  }
  slides.forEach(function(el,k){var p=el.querySelector('.pageno'); if(p)p.textContent=(k+1)+' / '+slides.length;});
  document.getElementById('tb-prev').addEventListener('click',function(){show(i-1);});
  document.getElementById('tb-next').addEventListener('click',function(){show(i+1);});
  document.getElementById('tb-fs').addEventListener('click',function(){
    if(document.fullscreenElement){document.exitFullscreen();}else{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
  });
  var ov=document.getElementById('overview');
  function buildOverview(){
    ov.innerHTML='';
    slides.forEach(function(el,k){
      var t=document.createElement('div'); t.className='thumb';
      var c=el.cloneNode(true); c.classList.add('active'); c.style.transform='scale(.3)';
      t.appendChild(c);
      var no=document.createElement('span'); no.className='no'; no.textContent=(k+1); t.appendChild(no);
      t.addEventListener('click',function(){closeOverview(); show(k);});
      ov.appendChild(t);
    });
  }
  function openOverview(){buildOverview(); ov.classList.add('open'); document.body.classList.add('overview-open');}
  function closeOverview(){ov.classList.remove('open'); document.body.classList.remove('overview-open'); fit();}
  document.getElementById('tb-ov').addEventListener('click',function(){ov.classList.contains('open')?closeOverview():openOverview();});
  var editBtn=document.getElementById('tb-edit');
  function setEditing(on){
    editing=on; document.body.classList.toggle('editing',on); editBtn.classList.toggle('on',on);
    document.querySelectorAll('.slide .kicker,.slide h1,.slide .takeaway,.slide .note').forEach(function(el){
      if(on){el.setAttribute('contenteditable','true');}else{el.removeAttribute('contenteditable');}
    });
  }
  editBtn.addEventListener('click',function(){setEditing(!editing);});
  document.addEventListener('dblclick',function(e){
    if(!editing)return;
    var t=e.target.closest?e.target.closest('svg text, svg tspan'):null;
    if(!t)return;
    var cur=t.textContent; var nv=window.prompt('図の中の文字を編集',cur);
    if(nv!==null&&nv!==cur){t.textContent=nv;}
  });
  function curFigSvg(){return slides[i].querySelector('.fig svg');}
  document.getElementById('r-fig').addEventListener('input',function(e){
    var v=e.target.value; document.getElementById('v-fig').textContent=v+'%';
    var svg=curFigSvg(); if(svg){svg.style.transform='scale('+(v/100)+')'; svg.style.transformOrigin='center center';}
  });
  document.getElementById('r-title').addEventListener('input',function(e){
    var v=e.target.value; document.getElementById('v-title').textContent=v+'px';
    var h1=slides[i].querySelector('h1'); if(h1)h1.style.fontSize=v+'px';
  });
  document.getElementById('r-take').addEventListener('input',function(e){
    var v=e.target.value; document.getElementById('v-take').textContent=v+'px';
    var tk=slides[i].querySelector('.takeaway'); if(tk)tk.style.fontSize=v+'px';
  });
  document.getElementById('ep-reset').addEventListener('click',function(){
    var sl=slides[i]; var svg=sl.querySelector('.fig svg'); if(svg)svg.style.transform='';
    var h1=sl.querySelector('h1'); if(h1)h1.style.fontSize='';
    var tk=sl.querySelector('.takeaway'); if(tk)tk.style.fontSize='';
    syncPanel();
  });
  document.getElementById('ep-save').addEventListener('click',function(){
    setEditing(false); closeOverview();
    var clone=document.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(function(el){el.removeAttribute('contenteditable');});
    var html='<!DOCTYPE html>\n'+clone.outerHTML;
    var blob=new Blob([html],{type:'text/html'}); var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='slides.html'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  });
  document.addEventListener('keydown',function(e){
    if(editing&&(e.target.isContentEditable||e.target.tagName==='INPUT'))return;
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); show(i+1);}
    else if(e.key==='ArrowLeft'){show(i-1);}
    else if(e.key==='Home'){show(0);}
    else if(e.key==='End'){show(slides.length-1);}
    else if(e.key==='Escape'){closeOverview();}
    else if(e.key==='o'||e.key==='O'){ov.classList.contains('open')?closeOverview():openOverview();}
  });
  document.getElementById('stage').addEventListener('click',function(e){
    if(editing||ov.classList.contains('open'))return;
    if(e.target.closest('.slide')){ if(e.clientX>window.innerWidth/2)show(i+1); else show(i-1); }
  });
  window.addEventListener('resize',fit);
  show(0);
})();
</script>
</body>
</html>
