<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DECK_TITLE}}</title>
<style>
/* slide-harness 標準テンプレート（IBM Carbon Design System のトークンに基づく）
   キーカラー Blue 60 #0F62FE / 淡色 Blue 10 #EDF5FF / 本文 Gray 100 #161616 / 罫線 Gray 50 #8D8D8D */
:root{
  --key:#0F62FE; --key-dark:#0043CE; --tint:#EDF5FF; --tint2:#D0E2FF;
  --ink:#161616; --ink-sub:#525252; --line:#8D8D8D; --paper:#FFFFFF;
  --warn:#B3261E; --focus:#FFD43D;
  --font:"IBM Plex Sans JP","IBM Plex Sans","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#3A3A3A;line-height:1.7}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{
  width:1280px;height:720px;flex:none;background:var(--paper);position:relative;
  padding:56px 72px 64px;display:none;flex-direction:column;transform-origin:center center;
}
.slide.active{display:flex}
.slide .kicker{font-size:15px;font-weight:700;color:var(--key);letter-spacing:.08em;margin-bottom:10px}
.slide h1{font-size:40px;line-height:1.35;font-weight:700;color:var(--ink);margin-bottom:28px}
.slide .fig{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.slide .fig svg{max-width:100%;max-height:100%}
.slide .takeaway{
  margin-top:28px;background:var(--tint);border-left:6px solid var(--key);
  padding:16px 20px;font-size:20px;font-weight:700;line-height:1.6;border-radius:0;background:#F4F4F4;
}
.slide .note{margin-top:14px;font-size:16px;color:var(--ink-sub);line-height:1.7}
.slide .pageno{position:absolute;right:72px;bottom:28px;font-size:14px;color:var(--ink-sub)}
.slide .deckname{position:absolute;left:72px;bottom:28px;font-size:14px;color:var(--ink-sub)}
/* 図の共通部品 */
svg text{font-family:var(--font)}
.box{fill:#fff;stroke:var(--key);stroke-width:2}
.box-tint{fill:var(--tint);stroke:var(--key);stroke-width:2}
.box-gray{fill:#F5F5F5;stroke:var(--line);stroke-width:1.5}
.box-warn{fill:#FDECEA;stroke:var(--warn);stroke-width:2}
.lbl{font-size:20px;font-weight:700;fill:var(--ink)}
.lbl-w{font-size:20px;font-weight:700;fill:#fff}
.sub{font-size:15px;fill:var(--ink-sub)}
.sub-w{font-size:15px;fill:#E8F1FE}
.arrow{stroke:var(--ink);stroke-width:2.5;fill:none;marker-end:url(#ah)}
.arrow-key{stroke:var(--key);stroke-width:3;fill:none;marker-end:url(#ahk)}
/* 操作 UI */
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:10px;align-items:center;z-index:10}
.hud button{
  font-family:var(--font);font-size:15px;font-weight:700;color:var(--key);background:#fff;
  border:2px solid var(--key);border-radius:8px;padding:8px 18px;cursor:pointer;
}
.hud button:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.hud .count{color:#fff;font-size:15px;font-weight:700}
.progress{position:fixed;top:0;left:0;height:5px;background:var(--key);z-index:10;transition:width .2s}
@media print{
  body{background:#fff}
  .stage{height:auto;display:block}
  .slide{display:flex;transform:none!important;page-break-after:always;border:1px solid var(--line);margin:0 auto 16px}
  .hud,.progress{display:none}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="stage" id="stage">
  <!-- スライドは section.slide を繰り返す。図は .fig の中にインライン SVG で実際に描く -->
  <section class="slide">
    <div class="kicker">{{SECTION}}</div>
    <h1>{{TITLE}}</h1>
    <div class="fig">
      <svg viewBox="0 0 1100 360" role="img" aria-label="{{FIG_ALT}}">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
          <marker id="ahk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0F62FE"/></marker>
        </defs>
        <!-- ここに図を描く -->
      </svg>
    </div>
    <div class="takeaway">{{TAKEAWAY}}</div>
    <div class="deckname">{{DECK_TITLE}}</div>
    <div class="pageno"></div>
  </section>
</div>
<style>
.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;align-items:center;z-index:20;background:rgba(22,22,22,.88);padding:8px 12px;border-radius:10px}
.toolbar button{font-family:var(--font);font-size:14px;font-weight:700;color:var(--key);background:#fff;border:2px solid var(--key);border-radius:6px;padding:6px 14px;cursor:pointer}
.toolbar button.on{background:var(--key);color:#fff}
.toolbar .count{color:#fff;font-size:14px;font-weight:700;min-width:64px;text-align:center}
.slidepanel{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;display:none;flex-direction:column;gap:6px;background:rgba(22,22,22,.88);padding:10px;border-radius:10px;max-height:86vh;overflow:auto}
body.editing .slidepanel{display:flex}
.slidepanel button{font-family:var(--font);font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer;text-align:left}
.slidepanel button.cur{border-color:var(--key);color:var(--key)}
.slidepanel .ops{display:flex;gap:4px;flex-wrap:wrap}
.slidepanel .ops button{flex:1;text-align:center;padding:5px 4px}
.prop{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;background:#fff;border:2px solid var(--key);border-radius:10px;padding:14px 16px;display:none;width:296px;font-size:14px;color:var(--ink);max-height:88vh;overflow:auto}
body.editing .prop{display:block}
.prop h3{font-size:15px;margin-bottom:8px}
.prop label{display:block;margin:9px 0 2px;font-weight:700}
.prop input[type=text],.prop input[type=number],.prop textarea{width:100%;font-family:var(--font);font-size:14px;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px}
.prop textarea{height:56px}
.prop input[type=color]{width:52px;height:30px;border:1.5px solid var(--line);border-radius:5px;background:#fff;vertical-align:middle}
.prop .swatches{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.prop .swatches button{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);cursor:pointer;padding:0}
.prop .row{display:flex;gap:6px;margin-top:10px}
.prop .row button{flex:1;font-family:var(--font);font-size:13px;font-weight:700;color:var(--key);background:#fff;border:2px solid var(--key);border-radius:6px;padding:6px 2px;cursor:pointer}
.prop .addrow{display:flex;gap:6px;margin-top:6px}
.prop .addrow button{flex:1;font-family:var(--font);font-size:13px;font-weight:700;color:#fff;background:var(--key);border:2px solid var(--key);border-radius:6px;padding:6px 2px;cursor:pointer}
.prop .hint{color:var(--ink-sub);margin-top:10px;line-height:1.6}
.prop .xy{display:flex;gap:6px}.prop .xy div{flex:1}
body.editing .slide svg *{cursor:pointer}
body.editing .slide .txtsel{outline:3px solid var(--focus);outline-offset:2px}
.selbox{position:fixed;z-index:15;border:2.5px solid var(--focus);border-radius:3px;pointer-events:none;display:none}
.txtedit{position:fixed;z-index:40;font-family:var(--font);border:2.5px solid var(--key);border-radius:4px;padding:4px 6px;background:#fff;color:var(--ink)}
.overview{position:fixed;inset:0;background:rgba(22,22,22,.94);z-index:30;display:none;overflow:auto;padding:28px}
.overview.open{display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start;justify-content:center}
.overview .thumb{width:384px;height:216px;overflow:hidden;position:relative;cursor:pointer;border:3px solid transparent;border-radius:6px;flex:none}
.overview .thumb:hover{border-color:var(--key)}
.overview .thumb .slide{display:flex;position:absolute;left:0;top:0;transform:scale(.3);transform-origin:top left}
.overview .thumb .no{position:absolute;right:8px;bottom:6px;color:#fff;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;font-size:13px;z-index:2}
@media print{.toolbar,.slidepanel,.prop,.selbox,.overview,.txtedit{display:none!important}}
</style>
<div class="toolbar">
  <button id="tb-prev" type="button">← 前へ</button>
  <span class="count" id="tb-count"></span>
  <button id="tb-next" type="button">次へ →</button>
  <button id="tb-fs" type="button">全画面</button>
  <button id="tb-ov" type="button">一覧</button>
  <button id="tb-edit" type="button">編集</button>
</div>
<div class="slidepanel" id="slidepanel"></div>
<div class="prop" id="prop"></div>
<div class="selbox" id="selbox"></div>
<div class="overview" id="overview"></div>
<script>
(function(){
  var stage=document.getElementById('stage');
  var selbox=document.getElementById('selbox');
  var prop=document.getElementById('prop');
  var i=0, editing=false, sel=null, selIsSvg=false;
  var undoStack=[], redoStack=[];
  function QS(){return [].slice.call(stage.querySelectorAll('.slide'));}
  function cur(){return QS()[i];}
  function snapshot(){undoStack.push(stage.innerHTML); if(undoStack.length>60)undoStack.shift(); redoStack=[];}
  function restore(html){stage.innerHTML=html; clearSel(); renumber(); show(Math.min(i,QS().length-1)); buildSlidePanel();}
  function undo(){if(!undoStack.length)return; redoStack.push(stage.innerHTML); restore(undoStack.pop());}
  function redo(){if(!redoStack.length)return; undoStack.push(stage.innerHTML); restore(redoStack.pop());}
  function renumber(){QS().forEach(function(el,k){var p=el.querySelector('.pageno'); if(p)p.textContent=(k+1)+' / '+QS().length;});}
  function fit(){
    if(document.body.classList.contains('overview-open'))return;
    var s=Math.min(window.innerWidth/1320,window.innerHeight/760,1.4);
    QS().forEach(function(el){el.style.transform='scale('+s+')';});
  }
  function show(n){
    var sl=QS(); i=Math.max(0,Math.min(sl.length-1,n));
    sl.forEach(function(el,k){el.classList.toggle('active',k===i);});
    document.getElementById('tb-count').textContent=(i+1)+' / '+sl.length;
    var pr=document.getElementById('progress'); if(pr)pr.style.width=((i+1)/sl.length*100)+'%';
    fit(); clearSel(); buildSlidePanel();
  }
  /* ---------- slideshow ---------- */
  document.getElementById('tb-prev').addEventListener('click',function(){show(i-1);});
  document.getElementById('tb-next').addEventListener('click',function(){show(i+1);});
  document.getElementById('tb-fs').addEventListener('click',function(){
    if(document.fullscreenElement)document.exitFullscreen(); else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
  });
  var ov=document.getElementById('overview');
  function buildOverview(){
    ov.innerHTML='';
    QS().forEach(function(el,k){
      var t=document.createElement('div'); t.className='thumb';
      var c=el.cloneNode(true); c.classList.add('active'); c.style.transform='scale(.3)';
      t.appendChild(c);
      var no=document.createElement('span'); no.className='no'; no.textContent=(k+1); t.appendChild(no);
      t.addEventListener('click',function(){closeOverview(); show(k);});
      ov.appendChild(t);
    });
  }
  function openOverview(){buildOverview(); ov.classList.add('open'); document.body.classList.add('overview-open');}
  function closeOverview(){ov.classList.remove('open'); document.body.classList.remove('overview-open'); fit();}
  document.getElementById('tb-ov').addEventListener('click',function(){ov.classList.contains('open')?closeOverview():openOverview();});
  stage.addEventListener('click',function(e){
    if(editing||ov.classList.contains('open'))return;
    if(e.target.closest('.slide')){ if(e.clientX>window.innerWidth/2)show(i+1); else show(i-1); }
  });
  /* ---------- edit mode ---------- */
  var editBtn=document.getElementById('tb-edit');
  function setEditing(on){
    editing=on; document.body.classList.toggle('editing',on); editBtn.classList.toggle('on',on);
    if(!on)clearSel(); buildSlidePanel();
  }
  editBtn.addEventListener('click',function(){setEditing(!editing);});
  function buildSlidePanel(){
    var sp=document.getElementById('slidepanel'); sp.innerHTML='';
    QS().forEach(function(el,k){
      var b=document.createElement('button'); b.textContent=(k+1)+'. '+((el.querySelector('h1')||{}).textContent||'（無題）').slice(0,18);
      if(k===i)b.className='cur';
      b.addEventListener('click',function(){show(k);});
      sp.appendChild(b);
    });
    var ops=document.createElement('div'); ops.className='ops';
    [['＋ 追加',addSlide],['複製',dupSlide],['削除',delSlide],['↑',function(){moveSlide(-1);}],['↓',function(){moveSlide(1);} ]].forEach(function(pair){
      var b=document.createElement('button'); b.textContent=pair[0]; b.addEventListener('click',pair[1]); ops.appendChild(b);
    });
    sp.appendChild(ops);
  }
  function blankSlide(){
    var s=document.createElement('section'); s.className='slide';
    s.innerHTML='<div class="kicker">見出し</div><h1>タイトルを入力</h1><div class="fig"><svg viewBox="0 0 1100 340" role="img"></svg></div><div class="takeaway">要点を入力</div><div class="deckname"></div><div class="pageno"></div>';
    var dn=cur()&&cur().querySelector('.deckname'); if(dn)s.querySelector('.deckname').textContent=dn.textContent;
    return s;
  }
  function addSlide(){snapshot(); var s=blankSlide(); cur().after(s); renumber(); show(i+1);}
  function dupSlide(){snapshot(); var c=cur().cloneNode(true); cur().after(c); renumber(); show(i+1);}
  function delSlide(){if(QS().length<=1)return; snapshot(); var idx=i; cur().remove(); renumber(); show(Math.min(idx,QS().length-1));}
  function moveSlide(d){var t=i+d; if(t<0||t>=QS().length)return; snapshot(); var el=cur(); if(d<0)el.previousElementSibling.before(el); else el.nextElementSibling.after(el); renumber(); show(t);}
  /* ---------- selection ---------- */
  function clearSel(){
    if(sel&&!selIsSvg)sel.classList.remove('txtsel');
    sel=null; selbox.style.display='none'; if(editing)renderProp(null);
  }
  function placeSelbox(){
    if(!sel)return; var r=sel.getBoundingClientRect();
    selbox.style.display='block'; selbox.style.left=(r.left-3)+'px'; selbox.style.top=(r.top-3)+'px';
    selbox.style.width=(r.width+6)+'px'; selbox.style.height=(r.height+6)+'px';
  }
  function select(el,isSvg){
    if(sel&&!selIsSvg)sel.classList.remove('txtsel');
    sel=el; selIsSvg=isSvg;
    if(!isSvg)el.classList.add('txtsel');
    placeSelbox(); renderProp(el);
  }
  function topSvgChild(el,svg){while(el&&el.parentNode!==svg)el=el.parentNode; return el;}
  /* drag */
  var drag=null;
  stage.addEventListener('pointerdown',function(e){
    if(!editing)return;
    var slideEl=e.target.closest('.slide'); if(!slideEl||slideEl!==cur())return;
    var svg=e.target.closest('svg');
    if(svg&&svg.closest('.fig')){
      var el=topSvgChild(e.target,svg);
      if(!el||el===svg)return;
      select(el,true);
      drag={el:el,sx:e.clientX,sy:e.clientY,moved:false,svg:svg};
      e.preventDefault();
    }else{
      var txt=e.target.closest('.kicker,h1,.takeaway,.note');
      if(txt){select(txt,false);} else clearSel();
    }
  });
  window.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>2&&!drag.moved){snapshot(); drag.moved=true;}
    if(!drag.moved)return;
    var r=drag.svg.getBoundingClientRect(); var vb=drag.svg.viewBox.baseVal;
    var f=(vb&&vb.width? vb.width:1100)/r.width;
    var t=getT(drag.el); setT(drag.el,t.x+dx*f,t.y+dy*f);
    drag.sx=e.clientX; drag.sy=e.clientY; placeSelbox(); syncXY();
  });
  window.addEventListener('pointerup',function(){drag=null;});
  function getT(el){
    var tr=el.getAttribute('transform')||''; var m=tr.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/);
    return {x:m?parseFloat(m[1]):0, y:m?parseFloat(m[2]):0, rest:tr.replace(/translate\([^)]*\)/,'').trim()};
  }
  function setT(el,x,y){
    var t=getT(el); var s='translate('+Math.round(x*10)/10+' '+Math.round(y*10)/10+')'; if(t.rest)s+=' '+t.rest;
    el.setAttribute('transform',s);
  }
  /* inline text edit */
  stage.addEventListener('dblclick',function(e){
    if(!editing)return;
    var target=null, isSvg=false;
    var svg=e.target.closest('svg');
    if(svg&&svg.closest('.fig')){target=e.target.closest('text,tspan'); isSvg=true;}
    if(!target){var txt=e.target.closest('.kicker,h1,.takeaway,.note'); if(txt)target=txt;}
    if(!target)return;
    e.preventDefault();
    var r=target.getBoundingClientRect();
    var ta=document.createElement('textarea'); ta.className='txtedit'; ta.value=target.textContent;
    ta.style.left=r.left+'px'; ta.style.top=r.top+'px'; ta.style.width=Math.max(160,r.width+30)+'px'; ta.style.height=Math.max(36,r.height+14)+'px';
    ta.style.fontSize=(isSvg?16:18)+'px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var done=false;
    function commit(save){
      if(done)return; done=true;
      if(save&&ta.value!==target.textContent){snapshot(); target.textContent=ta.value;}
      ta.remove(); placeSelbox(); buildSlidePanel();
    }
    ta.addEventListener('blur',function(){commit(true);});
    ta.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey))commit(true); if(ev.key==='Escape')commit(false); ev.stopPropagation();});
  });
  /* ---------- property panel ---------- */
  var PALETTE=['#0F62FE','#161616','#525252','#6929C4','#B3261E','#FFFFFF','#EDF5FF','#F4F4F4'];
  function colorRow(label,get,set){
    var wrap=document.createElement('div');
    var lb=document.createElement('label'); lb.textContent=label; wrap.appendChild(lb);
    var c=document.createElement('input'); c.type='color'; c.value=toHex(get());
    c.addEventListener('input',function(){snapshotSoft(); set(c.value); placeSelbox();});
    wrap.appendChild(c);
    var sw=document.createElement('span'); sw.className='swatches';
    PALETTE.forEach(function(p){var b=document.createElement('button'); b.style.background=p; b.addEventListener('click',function(){snapshot(); set(p); c.value=p; placeSelbox();}); sw.appendChild(b);});
    wrap.appendChild(sw);
    return wrap;
  }
  var softSnap=false;
  function snapshotSoft(){if(softSnap)return; softSnap=true; snapshot(); setTimeout(function(){softSnap=false;},800);}
  function toHex(v){
    if(!v)return '#000000';
    if(v.charAt(0)==='#')return v.length===4? '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3] : v;
    var m=v.match(/\d+/g); if(!m)return '#000000';
    return '#'+m.slice(0,3).map(function(n){return ('0'+parseInt(n).toString(16)).slice(-2);}).join('');
  }
  function numRow(label,val,min,max,apply){
    var wrap=document.createElement('div');
    var lb=document.createElement('label'); lb.textContent=label; wrap.appendChild(lb);
    var inp=document.createElement('input'); inp.type='number'; inp.value=Math.round(val); if(min!==undefined)inp.min=min; if(max!==undefined)inp.max=max;
    inp.addEventListener('change',function(){snapshot(); apply(parseFloat(inp.value)||0); placeSelbox();});
    wrap.appendChild(inp); return wrap;
  }
  function renderProp(el){
    prop.innerHTML='';
    var h=document.createElement('h3'); h.textContent='編集パネル'; prop.appendChild(h);
    var addH=document.createElement('label'); addH.textContent='図に要素を追加'; prop.appendChild(addH);
    var addRow=document.createElement('div'); addRow.className='addrow';
    [['テキスト',addText],['四角',addRect],['矢印',addArrow]].forEach(function(p){
      var b=document.createElement('button'); b.textContent=p[0]; b.addEventListener('click',p[1]); addRow.appendChild(b);
    });
    prop.appendChild(addRow);
    var row0=document.createElement('div'); row0.className='row';
    [['元に戻す',undo],['やり直し',redo],['HTMLで保存',saveHtml]].forEach(function(p){
      var b=document.createElement('button'); b.textContent=p[0]; b.addEventListener('click',p[1]); row0.appendChild(b);
    });
    prop.appendChild(row0);
    if(!el){
      var hint=document.createElement('div'); hint.className='hint';
      hint.textContent='スライド上の要素をクリックすると、ここで編集できます。ドラッグで移動、ダブルクリックで文字の編集、Deleteキーで削除、矢印キーで微調整（Shiftで大きく）。左のパネルでスライドの追加・複製・削除・並べ替えができます。';
      prop.appendChild(hint); return;
    }
    var tag=el.tagName.toLowerCase();
    /* position */
    if(selIsSvg){
      var t=getT(el);
      var xy=document.createElement('div'); xy.className='xy';
      var xw=document.createElement('div'); var xl=document.createElement('label'); xl.textContent='X（移動）'; var xi=document.createElement('input'); xi.type='number'; xi.id='pp-x'; xi.value=Math.round(t.x);
      var yw=document.createElement('div'); var yl=document.createElement('label'); yl.textContent='Y（移動）'; var yi=document.createElement('input'); yi.type='number'; yi.id='pp-y'; yi.value=Math.round(t.y);
      function applyXY(){var tt=getT(el); setT(el,parseFloat(xi.value)||0,parseFloat(yi.value)||0); placeSelbox();}
      xi.addEventListener('change',function(){snapshot(); applyXY();}); yi.addEventListener('change',function(){snapshot(); applyXY();});
      xw.appendChild(xl); xw.appendChild(xi); yw.appendChild(yl); yw.appendChild(yi); xy.appendChild(xw); xy.appendChild(yw); prop.appendChild(xy);
    }
    if(tag==='text'||tag==='tspan'||!selIsSvg){
      var lb=document.createElement('label'); lb.textContent='テキスト'; prop.appendChild(lb);
      var ta=document.createElement('textarea'); ta.value=el.textContent;
      ta.addEventListener('change',function(){snapshot(); el.textContent=ta.value; placeSelbox(); buildSlidePanel();});
      prop.appendChild(ta);
      var fs=parseFloat(selIsSvg?(el.getAttribute('font-size')||getComputedStyle(el).fontSize):getComputedStyle(el).fontSize)||16;
      prop.appendChild(numRow('文字サイズ',fs,8,80,function(v){snapshotSoft(); if(selIsSvg)el.setAttribute('font-size',v); else el.style.fontSize=v+'px'; placeSelbox();}));
      prop.appendChild(colorRow('文字の色',function(){return selIsSvg?(el.getAttribute('fill')||getComputedStyle(el).fill):el.style.color||getComputedStyle(el).color;},function(v){if(selIsSvg)el.setAttribute('fill',v); else el.style.color=v;}));
    }
    if(selIsSvg&&(tag==='rect'||tag==='circle'||tag==='ellipse')){
      if(tag==='rect'){
        prop.appendChild(numRow('幅',parseFloat(el.getAttribute('width'))||0,4,1200,function(v){el.setAttribute('width',v); placeSelbox();}));
        prop.appendChild(numRow('高さ',parseFloat(el.getAttribute('height'))||0,4,800,function(v){el.setAttribute('height',v); placeSelbox();}));
      }
      prop.appendChild(colorRow('塗りの色',function(){return el.getAttribute('fill')||getComputedStyle(el).fill;},function(v){el.setAttribute('fill',v);}));
      prop.appendChild(colorRow('線の色',function(){return el.getAttribute('stroke')||getComputedStyle(el).stroke;},function(v){el.setAttribute('stroke',v);}));
      prop.appendChild(numRow('線の太さ',parseFloat(el.getAttribute('stroke-width'))||1.5,0,10,function(v){el.setAttribute('stroke-width',v);}));
    }
    if(selIsSvg&&(tag==='path'||tag==='line')){
      prop.appendChild(colorRow('線の色',function(){return el.getAttribute('stroke')||getComputedStyle(el).stroke;},function(v){el.setAttribute('stroke',v);}));
      prop.appendChild(numRow('線の太さ',parseFloat(el.getAttribute('stroke-width'))||2,0,10,function(v){el.setAttribute('stroke-width',v);}));
    }
    var row=document.createElement('div'); row.className='row';
    var bd=document.createElement('button'); bd.textContent='複製'; bd.addEventListener('click',function(){
      snapshot(); var c=el.cloneNode(true);
      if(selIsSvg){var t=getT(c); setT(c,t.x+16,t.y+16); el.after(c); select(c,true);}
      else{el.after(c); select(c,false);}
    });
    var bx=document.createElement('button'); bx.textContent='削除'; bx.addEventListener('click',function(){snapshot(); el.remove(); clearSel();});
    row.appendChild(bd); row.appendChild(bx); prop.appendChild(row);
  }
  function syncXY(){
    if(!sel||!selIsSvg)return; var t=getT(sel);
    var xi=document.getElementById('pp-x'), yi=document.getElementById('pp-y');
    if(xi)xi.value=Math.round(t.x); if(yi)yi.value=Math.round(t.y);
  }
  function figSvg(){return cur()&&cur().querySelector('.fig svg');}
  function addText(){
    var svg=figSvg(); if(!svg)return; snapshot();
    var t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',550); t.setAttribute('y',170); t.setAttribute('text-anchor','middle');
    t.setAttribute('class','lbl'); t.textContent='テキスト';
    svg.appendChild(t); select(t,true);
  }
  function addRect(){
    var svg=figSvg(); if(!svg)return; snapshot();
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',450); r.setAttribute('y',130); r.setAttribute('width',200); r.setAttribute('height',80); r.setAttribute('rx',10);
    r.setAttribute('class','box');
    svg.appendChild(r); select(r,true);
  }
  function addArrow(){
    var svg=figSvg(); if(!svg)return; snapshot();
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M450,170 L650,170'); p.setAttribute('class','arrow');
    svg.appendChild(p); select(p,true);
  }
  function saveHtml(){
    setEditing(false); closeOverview();
    var clone=document.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(function(el){el.removeAttribute('contenteditable');});
    var cb=clone.querySelector('body'); if(cb)cb.classList.remove('editing','overview-open');
    var html='<!DOCTYPE html>\n'+clone.outerHTML;
    var blob=new Blob([html],{type:'text/html'}); var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='slides.html'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }
  /* ---------- keyboard ---------- */
  document.addEventListener('keydown',function(e){
    var inField=/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName||'')||(document.activeElement&&document.activeElement.isContentEditable);
    if(editing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault(); if(e.shiftKey)redo(); else undo(); return;}
    if(editing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault(); redo(); return;}
    if(editing&&sel&&!inField){
      if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault(); snapshot(); sel.remove(); clearSel(); return;}
      var step=e.shiftKey?10:1, used=true;
      if(e.key==='ArrowLeft')nudge(-step,0); else if(e.key==='ArrowRight')nudge(step,0);
      else if(e.key==='ArrowUp')nudge(0,-step); else if(e.key==='ArrowDown')nudge(0,step); else used=false;
      if(used){e.preventDefault(); return;}
    }
    if(inField)return;
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); show(i+1);}
    else if(e.key==='ArrowLeft'){show(i-1);}
    else if(e.key==='Home'){show(0);}
    else if(e.key==='End'){show(QS().length-1);}
    else if(e.key==='Escape'){closeOverview(); if(editing)setEditing(false);}
    else if(e.key==='o'||e.key==='O'){ov.classList.contains('open')?closeOverview():openOverview();}
  });
  var nudgeT=null;
  function nudge(dx,dy){
    if(!sel||!selIsSvg)return;
    if(!nudgeT)snapshot();
    clearTimeout(nudgeT); nudgeT=setTimeout(function(){nudgeT=null;},600);
    var t=getT(sel); setT(sel,t.x+dx,t.y+dy); placeSelbox(); syncXY();
  }
  window.addEventListener('resize',function(){fit(); placeSelbox();});
  renumber();
  var h=location.hash.match(/slide=(\d+)/); show(h?parseInt(h[1])-1:0);
  if(location.hash.indexOf('edit')>=0)setEditing(true);
  renderProp(null);
})();
</script>
</body>
</html>
